name: Backend API Tests CI

on:
  pull_request:
    branches: ['development', 'staging', 'prod']

permissions:
  contents: read
  pull-requests: read

jobs:
  # Filtro de rutas: si el PR solo toca documentación, los demás jobs quedan
  # "skipped", que cuenta como aprobado en los checks requeridos. Con
  # on.pull_request.paths el workflow ni arrancaría y el check quedaría pendiente.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Detectar cambios de código
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  test:
    name: test-api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: test-api
        run: npm test

      - name: Build
        run: npm run build

  # Construye la imagen igual que Dokploy y comprueba que arranca, pasa el
  # HEALTHCHECK y se apaga ordenadamente con SIGTERM. Las variables son falsas:
  # /health responde 200 aunque la BD no exista (reporta database: down).
  docker:
    name: docker-build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t hospitalunicaes-api:ci .

      - name: Arrancar el contenedor
        run: |
          docker run -d --name api -p 3000:3000 \
            -e DATABASE_URL="postgresql://user:pass@127.0.0.1:5432/db" \
            -e DIRECT_URL="postgresql://user:pass@127.0.0.1:5432/db" \
            -e SUPABASE_URL="https://example.supabase.co" \
            -e SUPABASE_SERVICE_ROLE_KEY="ci-fake-key" \
            hospitalunicaes-api:ci

      - name: Esperar el HEALTHCHECK
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' api)
            echo "intento $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$(docker inspect --format='{{.State.Running}}' api)" = "false" ] && break
            sleep 2
          done
          docker logs api
          exit 1

      - name: GET /health
        run: curl -fsS http://127.0.0.1:3000/health

      - name: Apagado ordenado (docker stop debe tardar menos de 9 s)
        run: |
          start=$(date +%s)
          docker stop api
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop tardó ${elapsed}s"
          docker logs api | tail -5
          [ "$elapsed" -lt 9 ]
          [ "$(docker inspect --format='{{.State.ExitCode}}' api)" = "0" ]

  # Migraciones desde cero + seed idempotente + tests pgTAP (supabase/tests)
  test-db:
    name: test-db
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Levantar Supabase (aplica migraciones y seed desde cero)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta,mailpit,storage-api,realtime

      - name: Seed idempotente (se aplica dos veces más)
        run: |
          for i in 1 2; do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          done

      - name: Tests de base de datos (pgTAP)
        run: supabase test db
